[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
muretto-core = { path = "crates/core" }
gpui-kit = "0.9.1"
serde_json = "1"
thiserror = "2"
encoding_rs = "0.8"
dirs = "6"

# The UI framework is most of the compile; optimise it even in dev so
# scrolling and image decoding stay smooth while iterating.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
