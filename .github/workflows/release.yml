# Builds Muretto for Linux and Windows when a version tag is pushed, and
# attaches both to a draft GitHub release to look over and publish.
#
# The assets are the bare binaries, named without a version, so
# releases/latest/download/<name> always fetches the newest one: the group
# server's landing page links there. SHA256SUMS lists their checksums.
#
# Linux builds on the oldest supported Ubuntu so the binary runs on older
# glibc too. Windows must build on Windows: gpui compiles its shaders with
# the SDK's fxc.exe only on a Windows host.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libasound2-dev

      - name: Build
        run: cargo build -p muretto --release --locked

      - name: Name the binary (Linux)
        if: runner.os == 'Linux'
        run: |
          cp target/release/muretto muretto-${{ matrix.name }}
          echo "ASSET=muretto-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Name the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/release/muretto.exe muretto-${{ matrix.name }}.exe
          "ASSET=muretto-${{ matrix.name }}.exe" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum muretto-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            muretto-*
            SHA256SUMS
