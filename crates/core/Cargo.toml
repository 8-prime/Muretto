[package]
name = "muretto-core"
description = "Assetto Corsa install discovery, content scanning and session launching. No UI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
encoding_rs.workspace = true
dirs.workspace = true
ureq = { version = "3.5.2", default-features = false, features = ["gzip", "rustls"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
