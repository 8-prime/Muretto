[package]
name = "muretto-core"
description = "Assetto Corsa install discovery, content scanning and session launching. No UI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
encoding_rs.workspace = true
dirs.workspace = true
ureq = { version = "3.5.2", default-features = false, features = ["gzip", "rustls"] }
# Mod archives come from 7-Zip as often as not, in any method it offers.
zip = { version = "9.5.1", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "ppmd"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
# Checks the shader compiler Muretto downloads for the patch under Proton.
sha2 = "0.10"
# Groups: the protocol, a blocking WebSocket, and the TLS and crypto ureq
# already brings in.
muretto-group-protocol = { path = "../group-protocol" }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ring = "0.17"
base64 = "0.22"
# Server hosts: the agent's API.
muretto-host-protocol = { path = "../host-protocol" }
serde = "1"

[dev-dependencies]
# The host client is tested against the real agent.
muretto-host-agent = { path = "../host-agent" }
axum = "0.8.9"
tokio = { version = "1.54", features = ["rt-multi-thread", "net"] }
# Tests write 7z archives to unpack.
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress", "util"] }
