[package]
name = "muretto-host-protocol"
description = "What Muretto and its host agent say to each other: server presets and the content a server needs."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# Preset ids: v7, so they sort by creation.
uuid = { version = "1.29", features = ["serde", "v7"] }

[dev-dependencies]
serde_json.workspace = true
