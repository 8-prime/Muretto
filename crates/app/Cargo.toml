[package]
name = "muretto"
description = "A launcher and content manager for Assetto Corsa."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Offscreen rendering for `src/bin/shot.rs`.
shot = ["gpui-kit/test-support"]

[dependencies]
muretto-core.workspace = true
gpui-kit.workspace = true
dirs.workspace = true
# The version gpui decodes with, for the window icon.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[[bin]]
name = "muretto"
path = "src/main.rs"

[[bin]]
name = "shot"
path = "src/bin/shot.rs"
required-features = ["shot"]
